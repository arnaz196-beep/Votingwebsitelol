<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make Ben Great Again!</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 30px;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
        }

        .options {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .option {
            flex: 1;
            padding: 25px;
            border: 2px solid #ddd;
            border-radius: 15px;
        }

        button {
            padding: 15px 35px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Make Ben Great Again!</h1>

    <!-- PUT YOUR IMAGE HERE -->
    <!-- <img src="your-image.jpg" width="500"> -->

    <!-- PUT YOUR EXTRA TEXT HERE -->
    <p>
        Voting website, vote can be changed at any time!
    </p>

    <h2>What do you want Ben to become?</h2>

    <div class="options">

        <div class="option">
            <h2>Option 1</h2>
            <p>Description for option A.</p>
            <button onclick="vote('A')">VOTE A</button>
        </div>

        <div class="option">
            <h2>Option B</h2>
            <p>Description for option B.</p>
            <button onclick="vote('B')">VOTE B</button>
        </div>

    </div>

    <h2>Live Results</h2>

    <p>Option A: <span id="votesA">0</span></p>
    <p>Option B: <span id="votesB">0</span></p>

    <p id="message"></p>

</div>

<script>

    // ==========================================
    // PUT YOUR SUPABASE INFORMATION HERE
    // ==========================================

    const SUPABASE_URL = "https://xofvjukkpkgochbnrskh.supabase.co";

    const SUPABASE_KEY = "sb_publishable_BRq5GwINy74amHFmvs21_w_TvuvzE_t";


    const supabaseClient =
        supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


    // ==========================================
    // LOAD VOTES
    // ==========================================

    async function loadVotes() {

        const { data, error } = await supabaseClient
            .from("votes")
            .select("option");

        if (error) {
            console.error(error);
            return;
        }

        let a = 0;
        let b = 0;

        data.forEach(vote => {

            if (vote.option === "A") {
                a++;
            }

            if (vote.option === "B") {
                b++;
            }

        });

        document.getElementById("votesA").textContent = a;
        document.getElementById("votesB").textContent = b;
    }


    // ==========================================
    // VOTE
    // ==========================================

    async function vote(option) {

    let voterId = localStorage.getItem("voter_id");

    if (!voterId) {
        voterId = crypto.randomUUID();
        localStorage.setItem("voter_id", voterId);
    }

    const { error } = await supabaseClient
        .from("votes")
        .insert({
            voter_id: voterId,
            option: option
        });

    if (error) {

        if (error.code === "23505") {
            document.getElementById("message").textContent =
                "You have already voted on this device.";
        } else {
            console.error(error);
            document.getElementById("message").textContent =
                "There was an error submitting your vote.";
        }

        return;
    }

    document.getElementById("message").textContent =
        "Vote submitted!";

    loadVotes();
}

    // ==========================================
    // LIVE UPDATES
    // ==========================================

    supabaseClient
        .channel("live-votes")
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "votes"
            },
            function() {
                loadVotes();
            }
        )
        .subscribe();


    loadVotes();

</script>

</body>
</html>
